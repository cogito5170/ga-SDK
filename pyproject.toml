[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-sdk"
version = "0.4.0"
description = "Hub loop SDK: directive / report / verdict forms, integration, rules, gates, records"
requires-python = ">=3.10"
# the source of these pins is ga/_pins.py; this list must say the same (tests/test_pins.py)
dependencies = [
    "rlo-sdk[sensor] @ git+https://github.com/cogito5170/rlo-SDK@063b861df32e783f5cacde5db079187965a82f5c",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2"]
http = ["httpx>=0.25"]  # openai_http · anthropic_http (CMD-GA28); the other backends need nothing more

[project.entry-points."ga.backends"]  # the built-ins load through the same path as an installed plugin (agv first)
agv = "ga.backends.builtin:AGV"
gemini_cli = "ga.backends.builtin:GEMINI_CLI"
claude_cli = "ga.backends.builtin:CLAUDE_CLI"
codex_cli = "ga.backends.builtin:CODEX_CLI"
openai_http = "ga.backends.http:OPENAI_HTTP"
anthropic_http = "ga.backends.http:ANTHROPIC_HTTP"

[project.scripts]
ga = "ga.__main__:main"

[tool.setuptools.packages.find]
include = ["ga*"]

[tool.setuptools.package-data]
ga = ["specs/*.pspec", "specs/forms/*.pspec"]  # the supervisor's prompt spec (GA26, GA28), the form specs (GA27)
