[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-sdk"
version = "0.1.0"
description = "Hub loop SDK: directive / report / verdict forms, integration, rules, gates, records"
requires-python = ">=3.10"
# the source of these pins is ga/_pins.py; this list must say the same (tests/test_pins.py)
dependencies = [
    "rlo-sdk[sensor] @ git+https://github.com/cogito5170/rlo-SDK@6bc76c7df10956415a084d667d91d9a7a9f6bce0",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2"]

[project.scripts]
ga = "ga.__main__:main"

[tool.setuptools.packages.find]
include = ["ga*"]

[tool.setuptools.package-data]
ga = ["specs/*.pspec"]  # ga gemini's prompt spec (CMD-GA26)
