[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-sdk"
version = "0.1.0"
description = "Hub loop SDK: directive / report / verdict forms, integration, rules, gates, records"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2"]

[project.scripts]
ga = "ga.__main__:main"

[tool.setuptools.packages.find]
include = ["ga*"]
