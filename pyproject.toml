[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-sdk"
version = "0.1.0"
description = "Hub loop SDK: directive / report / verdict forms, integration, rules, gates, records"
requires-python = ">=3.10"
# the source of these pins is ga/_pins.py; this list must say the same (tests/test_pins.py)
dependencies = [
    "rlo-sdk[sensor] @ git+https://github.com/cogito5170/rlo-SDK@250a88e56a74d2776688d34ec732cbd0f4244ba0",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2"]

[project.scripts]
ga = "ga.__main__:main"

[tool.setuptools.packages.find]
include = ["ga*"]
